<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BibleSpace — Ruang Baca & Studi Alkitab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: { light: '#FAF8F5', dark: '#111110' },
            surface: { light: '#FFFFFF', dark: '#191817', subtleLight: '#F2EFE9', subtleDark: '#242220' },
            ink: { light: '#18181B', mutedLight: '#71717A', dark: '#F4F4F2', mutedDark: '#A1A19A' },
            brand: { DEFAULT: '#B45309', dark: '#92400E', soft: '#FEF3C7' },
            accent: { DEFAULT: '#C2410C', warm: '#D97706' }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Fraunces"', 'Georgia', 'serif'],
            serif: ['"Instrument Serif"', 'Georgia', 'serif']
          }
        }
      }
    };
  </script>
  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      transition: background-color 0.25s ease, color 0.25s ease;
      padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px));
    }
    .glass {
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-up { animation: fadeUp 0.32s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .verse-tap { transition: transform 0.15s ease, background-color 0.2s ease; }
    .verse-tap:active { transform: scale(0.995); }
    .photo-card img { transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .photo-card:hover img { transform: scale(1.04); }
    .safe-dock {
      bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px));
    }
    .safe-floating {
      bottom: calc(5rem + env(safe-area-inset-bottom, 0px));
    }
    @media (min-width: 768px) {
      body { padding-bottom: 2.5rem; }
      .safe-floating { bottom: 1.5rem; }
    }
  </style>
</head>
<body class="bg-canvas-light text-ink-light dark:bg-canvas-dark dark:text-ink-dark font-sans antialiased selection:bg-amber-500/20">

  <!-- Unified Adaptive Top Header (Balanced 3-Zone on Laptop, Clean & Compact on Mobile) -->
  <header id="app-header" class="sticky top-0 z-30 glass bg-canvas-light/88 dark:bg-canvas-dark/88 border-b border-stone-200/75 dark:border-stone-800/75">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <!-- Left: Brand Logo -->
      <button onclick="navigate('home')" class="flex items-center gap-2.5 group shrink-0 text-left">
        <div class="w-9 h-9 rounded-xl bg-stone-900 dark:bg-stone-100 text-stone-50 dark:text-stone-900 flex items-center justify-center font-serif italic text-xl font-bold group-hover:scale-105 transition-transform shadow-xs">
          B
        </div>
        <div>
          <span class="font-display font-bold text-base tracking-tight block leading-none">BibleSpace</span>
          <span class="text-[9px] font-semibold text-ink-mutedLight dark:text-ink-mutedDark tracking-widest uppercase mt-0.5 block">Scripture Journal</span>
        </div>
      </button>

      <!-- Center: Desktop / Laptop Primary Navigation Pill Bar -->
      <nav id="desktop-nav-items" aria-label="Navigasi Desktop" class="hidden md:flex items-center gap-1 p-1 rounded-full bg-surface-subtleLight/90 dark:bg-surface-subtleDark/90 border border-stone-200/70 dark:border-stone-800/70"></nav>

      <!-- Right: Utility Controls + Live Progress Pill -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button onclick="navigate('plans')" id="header-progress-pill" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-500/12 hover:bg-amber-500/20 text-brand text-xs font-bold transition-colors" title="Progres Bacaan">
          <span class="w-1.5 h-1.5 rounded-full bg-brand"></span>
          <span id="header-progress-text">0 Pasal</span>
        </button>

        <button onclick="openQuickSearch()" class="flex items-center gap-2 px-3 py-1.5 min-h-[36px] rounded-full bg-surface-light dark:bg-surface-dark border border-stone-200 dark:border-stone-800 text-xs text-ink-mutedLight dark:text-ink-mutedDark hover:border-brand transition-colors" title="Cari kitab">
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span id="quick-search-label" class="hidden lg:inline">Cari kitab...</span>
          <kbd class="hidden xl:inline text-[10px] px-1.5 py-0.5 rounded bg-surface-subtleLight dark:bg-surface-subtleDark font-mono">⌘K</kbd>
        </button>

        <button onclick="toggleUILang()" id="ui-lang-btn" class="px-3 py-1.5 min-h-[36px] rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark hover:bg-amber-500/15 text-xs font-bold tracking-wide transition-colors">
          ID
        </button>

        <button onclick="toggleTheme()" id="theme-btn" class="w-9 h-9 rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark hover:bg-amber-500/15 flex items-center justify-center transition-colors" title="Ganti Tema">
          <span id="theme-icon"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Viewport -->
  <main id="app-root" class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 min-h-[78vh]"></main>

  <!-- Mobile Bottom Floating Dock (Hidden on md+ screens where Top Nav takes over) -->
  <nav id="bottom-dock" aria-label="Navigasi Mobile" class="md:hidden fixed safe-dock left-1/2 -translate-x-1/2 z-40 w-[94%] max-w-md">
    <div id="bottom-nav-items" class="glass bg-surface-light/95 dark:bg-surface-dark/95 border border-stone-200/90 dark:border-stone-800/90 rounded-full px-1.5 py-1.5 shadow-xl flex items-center justify-between gap-1"></div>
  </nav>

  <!-- More / Menu Drawer Sheet -->
  <div id="more-menu-drawer" class="hidden fixed inset-0 z-50 bg-black/45 backdrop-blur-sm flex items-end sm:items-center justify-center p-3 sm:p-4" onclick="if(event.target===this) closeMoreMenu()">
    <div class="bg-surface-light dark:bg-surface-dark border border-stone-200 dark:border-stone-800 rounded-3xl w-full max-w-lg p-5 sm:p-6 shadow-2xl space-y-5 fade-up max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-stone-200/80 dark:border-stone-800 pb-3.5">
        <div>
          <span class="text-[10px] font-bold uppercase tracking-widest text-brand block">Eksplorasi &amp; Menu</span>
          <h3 class="font-display font-bold text-xl">Ruang Lainnya</h3>
        </div>
        <button onclick="closeMoreMenu()" class="w-9 h-9 rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark flex items-center justify-center hover:opacity-80">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div id="more-menu-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
    </div>
  </div>

  <!-- Interactive Verse Action Sheet -->
  <div id="verse-action-sheet" class="hidden fixed safe-floating left-1/2 -translate-x-1/2 z-50 w-[94%] max-w-xl glass bg-surface-light/95 dark:bg-surface-dark/95 border border-stone-300 dark:border-stone-700 rounded-3xl p-4 shadow-xl fade-up">
    <div class="flex items-center justify-between pb-3 mb-3 border-b border-stone-200 dark:border-stone-800">
      <div class="pr-2">
        <span id="sheet-verse-ref" class="font-display font-bold text-sm text-brand">Yohanes 1:5</span>
        <p id="sheet-verse-snippet" class="text-xs text-ink-mutedLight dark:text-ink-mutedDark line-clamp-1 mt-0.5"></p>
      </div>
      <button onclick="closeVerseSheet()" class="w-8 h-8 rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark text-xs flex items-center justify-center shrink-0">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-medium text-ink-mutedLight dark:text-ink-mutedDark mr-1">Stabilo:</span>
        <button onclick="applySheetHighlight('amber')" class="w-6 h-6 rounded-full bg-amber-300 border-2 border-white dark:border-stone-800 shadow-sm hover:scale-110 transition-transform" title="Warm Amber"></button>
        <button onclick="applySheetHighlight('terracotta')" class="w-6 h-6 rounded-full bg-orange-300 border-2 border-white dark:border-stone-800 shadow-sm hover:scale-110 transition-transform" title="Terracotta"></button>
        <button onclick="applySheetHighlight('stone')" class="w-6 h-6 rounded-full bg-stone-300 border-2 border-white dark:border-stone-800 shadow-sm hover:scale-110 transition-transform" title="Warm Stone"></button>
        <button onclick="applySheetHighlight('rose')" class="w-6 h-6 rounded-full bg-rose-300 border-2 border-white dark:border-stone-800 shadow-sm hover:scale-110 transition-transform" title="Clay Rose"></button>
        <button onclick="applySheetHighlight(null)" class="px-2.5 py-1 rounded-full text-[10px] bg-surface-subtleLight dark:bg-surface-subtleDark hover:opacity-80">Hapus</button>
      </div>

      <div class="flex items-center gap-1.5 text-xs font-medium">
        <button onclick="bookmarkFromSheet()" id="sheet-bm-btn" class="px-3 py-1.5 rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark hover:bg-amber-500/15 transition-colors">Simpan</button>
        <button onclick="noteFromSheet()" class="px-3 py-1.5 rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark hover:bg-amber-500/15 transition-colors">Catatan</button>
        <button onclick="shareCardFromSheet()" class="px-3.5 py-1.5 rounded-full bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 font-semibold transition-colors">Kartu</button>
      </div>
    </div>
  </div>

  <!-- Compact Responsive Reader Controls Bar -->
  <div id="reader-floating-bar" class="hidden fixed safe-floating left-1/2 -translate-x-1/2 z-30 glass bg-surface-light/95 dark:bg-surface-dark/95 border border-stone-200 dark:border-stone-800 px-2.5 sm:px-3.5 py-1.5 rounded-full shadow-lg flex items-center justify-center gap-1 sm:gap-2 text-[11px] sm:text-xs max-w-[95vw]">
    <button onclick="stepChapter(-1)" class="px-2 sm:px-2.5 py-1.5 rounded-full hover:bg-surface-subtleLight dark:hover:bg-surface-subtleDark font-medium shrink-0">← <span class="hidden sm:inline">Prev</span></button>
    <button onclick="speakCurrentChapter()" id="tts-btn" class="px-2.5 sm:px-3 py-1.5 rounded-full bg-amber-500/15 text-brand font-semibold flex items-center gap-1 hover:bg-amber-500/25 transition-colors shrink-0">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <span id="tts-label">Dengar</span>
    </button>
    <button onclick="adjustFontSize(-1)" class="w-7 h-7 rounded-full hover:bg-surface-subtleLight dark:hover:bg-surface-subtleDark font-semibold shrink-0">A-</button>
    <button onclick="adjustFontSize(1)" class="w-7 h-7 rounded-full hover:bg-surface-subtleLight dark:hover:bg-surface-subtleDark font-semibold shrink-0">A+</button>
    <button onclick="toggleFocusMode()" id="focus-btn" class="px-2 sm:px-2.5 py-1.5 rounded-full hover:bg-surface-subtleLight dark:hover:bg-surface-subtleDark shrink-0">Fokus</button>
    <button onclick="stepChapter(1)" class="px-2 sm:px-2.5 py-1.5 rounded-full hover:bg-surface-subtleLight dark:hover:bg-surface-subtleDark font-medium shrink-0"><span class="hidden sm:inline">Next</span> →</button>
  </div>

  <!-- Quick Search Command Modal (⌘K) -->
  <div id="search-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-start justify-center pt-16 sm:pt-20 p-4" onclick="if(event.target===this) closeQuickSearch()">
    <div class="bg-surface-light dark:bg-surface-dark border border-stone-200 dark:border-stone-800 rounded-3xl max-w-lg w-full p-5 shadow-2xl space-y-4 fade-up">
      <div class="flex items-center gap-3 border-b border-stone-200 dark:border-stone-800 pb-3">
        <svg class="w-4 h-4 text-brand shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="global-search-input" oninput="handleQuickSearch(this.value)" type="text" placeholder="Ketik nama kitab atau surat (misal: Roma, Filipi, Yohanes, Mazmur)..." class="w-full bg-transparent text-sm focus:outline-none" />
        <button onclick="closeQuickSearch()" class="text-xs px-2.5 py-1 rounded-lg bg-surface-subtleLight dark:bg-surface-subtleDark">ESC</button>
      </div>
      <div id="quick-search-results" class="max-h-72 overflow-y-auto space-y-1.5"></div>
    </div>
  </div>

  <!-- Personal Note Modal -->
  <div id="note-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) closeNoteModal()">
    <div class="bg-surface-light dark:bg-surface-dark border border-stone-200 dark:border-stone-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 fade-up">
      <div class="flex justify-between items-center">
        <h3 class="font-display font-bold text-lg">Catatan Refleksi</h3>
        <button onclick="closeNoteModal()" class="w-8 h-8 rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark text-xs flex items-center justify-center">✕</button>
      </div>
      <p id="note-verse-ref" class="text-xs font-semibold text-brand"></p>
      <p id="note-verse-preview" class="text-xs italic text-ink-mutedLight dark:text-ink-mutedDark bg-surface-subtleLight dark:bg-surface-subtleDark p-3 rounded-2xl"></p>
      <textarea id="note-input" rows="4" placeholder="Tulis insight, doa, atau perenunganmu di sini..." class="w-full rounded-2xl border border-stone-200 dark:border-stone-800 bg-transparent p-3.5 text-sm focus:outline-none focus:border-brand"></textarea>
      <div class="flex justify-end gap-2">
        <button onclick="closeNoteModal()" class="px-4 py-2 rounded-full text-xs font-medium">Batal</button>
        <button onclick="saveNote()" class="px-5 py-2 rounded-full bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 text-xs font-semibold">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed top-20 right-4 sm:right-6 z-50 bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 px-4 py-2.5 rounded-full shadow-lg text-xs font-semibold fade-up"></div>

  <!-- Minimalist Editorial Footer -->
  <footer id="app-footer" class="border-t border-stone-200/80 dark:border-stone-800/80 mt-20">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-lg bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 flex items-center justify-center font-serif italic font-bold text-xs">B</span>
          <span class="font-display font-bold text-sm">BibleSpace</span>
        </div>
        <p class="text-xs text-ink-mutedLight dark:text-ink-mutedDark">
          Alkitab Terjemahan Baru (TB) • Ruang baca, jurnal refleksi, dan studi firman harian.
        </p>
      </div>

      <div class="flex flex-wrap items-center gap-4 text-xs text-ink-mutedLight dark:text-ink-mutedDark">
        <button onclick="navigate('read')" class="hover:text-brand transition-colors">Alkitab</button>
        <span>•</span>
        <button onclick="navigate('study')" class="hover:text-brand transition-colors">Tafsir &amp; Kamus</button>
        <span>•</span>
        <button onclick="navigate('plans')" class="hover:text-brand transition-colors">Progres</button>
        <span>•</span>
        <button onclick="navigate('creator')" class="hover:text-brand transition-colors">Kreator</button>
        <span>•</span>
        <span>© 2026 BibleSpace</span>
      </div>
    </div>
  </footer>

        titleId: 'Perlengkapan & Keteguhan',
        titleEn: 'Armor & Perseverance',
        descId: 'Menguatkan langkah di tengah ujian hidup dan panggilan pelayanan.',
        descEn: 'Strengthening your walk through trials and daily calling.',
        milestones: [
          { id: 'c1', labelId: 'Perlengkapan Senjata Allah', labelEn: 'Full Armor of God', refId: 'Surat Efesus 6', refEn: 'Ephesians 6', bookId: 'EPH', ch: 6 },
          { id: 'c2', labelId: 'Buah Roh & Kemerdekaan', labelEn: 'Fruit of the Spirit', refId: 'Surat Galatia 5', refEn: 'Galatians 5', bookId: 'GAL', ch: 5 },
          { id: 'c3', labelId: 'Saksi-Saksi Iman', labelEn: 'Cloud of Witnesses', refId: 'Surat Ibrani 11', refEn: 'Hebrews 11', bookId: 'HEB', ch: 11 },
          { id: 'c4', labelId: 'Kasih yang Melenyapkan Takut', labelEn: 'Love Casts Out Fear', refId: 'Surat 1 Yohanes 4', refEn: '1 John 4', bookId: '1JN', ch: 4 }
        ]
      }
    ];

    // =========================================================================
    // 7. APPLICATION STATE (CLEAN ZERO-RESET WHEN UNREAD!)
    // =========================================================================
    const savedHistory = JSON.parse(localStorage.getItem('bs7_history') || '[]');
    const savedReadChapters = JSON.parse(localStorage.getItem('bs7_read_chapters') || '[]');
    const savedMilestones = JSON.parse(localStorage.getItem('bs7_milestones') || '[]');

    // Enforce rule: if user hasn't read anything yet (savedReadChapters is empty), force progress to 0!
    const hasStartedReading = savedReadChapters.length > 0;

    let state = {
      route: 'home',
      uiLang: localStorage.getItem('bs7_uilang') || 'id',
      theme: localStorage.getItem('bs7_theme') || 'light',
      translation: localStorage.getItem('bs7_trans') || 'id',
      currentBook: localStorage.getItem('bs7_book') || 'JHN',
      currentChapter: parseInt(localStorage.getItem('bs7_chapter') || '1', 10),
      fontSize: parseInt(localStorage.getItem('bs7_fontsize') || '18', 10),
      focusMode: false,
      chapterVerses: [],
      selectedVerse: null,
      bookmarks: JSON.parse(localStorage.getItem('bs7_bookmarks') || '[]'),
      highlights: JSON.parse(localStorage.getItem('bs7_highlights') || '{}'),
      notes: JSON.parse(localStorage.getItem('bs7_notes') || '[]'),
      history: hasStartedReading ? savedHistory : [],
      readChapters: hasStartedReading ? savedReadChapters : [],
      completedMilestones: hasStartedReading ? savedMilestones : [],
      spotlightIdx: 0,
      cardTheme: 'photoMorning',
      dailyCustomText: null,
      dailyCustomRef: null,
      quizIndex: 0,
      quizScore: 0,
      quizStreak: 0,
      quizSelectedOption: null,
      isSpeaking: false
    };

    function persist() {
      localStorage.setItem('bs7_uilang', state.uiLang);
      localStorage.setItem('bs7_theme', state.theme);
      localStorage.setItem('bs7_trans', state.translation);
      localStorage.setItem('bs7_book', state.currentBook);
      localStorage.setItem('bs7_chapter', String(state.currentChapter));
      localStorage.setItem('bs7_fontsize', String(state.fontSize));
      localStorage.setItem('bs7_bookmarks', JSON.stringify(state.bookmarks));
      localStorage.setItem('bs7_highlights', JSON.stringify(state.highlights));
      localStorage.setItem('bs7_notes', JSON.stringify(state.notes));
      localStorage.setItem('bs7_history', JSON.stringify(state.history));
      localStorage.setItem('bs7_read_chapters', JSON.stringify(state.readChapters));
      localStorage.setItem('bs7_milestones', JSON.stringify(state.completedMilestones));
    }

    function getProgressStats() {
      const totalMilestones = READING_TRACKS.reduce((acc, tr) => acc + tr.milestones.length, 0);
      const completedCount = state.completedMilestones.length;
      const chaptersCount = state.readChapters.length;
      // If user hasn't read any chapter yet, strictly return 0!
      if (chaptersCount === 0 && completedCount === 0) {
        return { chaptersCount: 0, completedCount: 0, totalMilestones, pct: 0, isZero: true };
      }
      const pct = Math.min(100, Math.round((completedCount / totalMilestones) * 100));
      return { chaptersCount, completedCount, totalMilestones, pct, isZero: false };
    }

    function resetAllProgress() {
      state.history = [];
      state.readChapters = [];
      state.completedMilestones = [];
      persist();
      renderNav();
      render();
      showToast(state.uiLang === 'id' ? 'Progres bacaan di-reset ke 0' : 'Reading progress reset to 0');
    }

    function markCurrentChapterCompleted() {
      const key = `${state.currentBook}:${state.currentChapter}`;
      const bookObj = BOOKS.find(b => b.id === state.currentBook) || BOOKS[0];
      const label = `${getBookName(bookObj)} ${state.currentChapter}`;

      if (!state.readChapters.includes(key)) {
        state.readChapters.push(key);
      }
      state.history = [label, ...state.history.filter(h => h !== label)].slice(0, 12);

      // Auto-complete any matching milestone in READING_TRACKS
      READING_TRACKS.forEach(tr => {
        tr.milestones.forEach(m => {
          if (m.bookId === state.currentBook && m.ch === state.currentChapter && !state.completedMilestones.includes(m.id)) {
            state.completedMilestones.push(m.id);
          }
        });
      });

      persist();
      renderNav();
      renderVerses(document.getElementById('verse-filter')?.value || '');
      showToast(state.uiLang === 'id' ? `Selesai dibaca: ${label}` : `Completed: ${label}`);
    }

    function t() { return I18N[state.uiLang]; }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastT);
      window._toastT = setTimeout(() => el.classList.add('hidden'), 2400);
    }

    function copyCreatorUsername() {
      navigator.clipboard.writeText('@doysleepwell');
      showToast('Handle @doysleepwell disalin!');
    }

    // =========================================================================
    // 8. THEME, LANGUAGE, ADAPTIVE TOP + BOTTOM NAVIGATION & MORE DRAWER
    // =========================================================================
    function applyTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (state.theme === 'dark') {
        html.classList.add('dark');
        if (icon) icon.innerHTML = ICONS.sun;
      } else {
        html.classList.remove('dark');
        if (icon) icon.innerHTML = ICONS.moon;
      }
    }

    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      persist();
      applyTheme();
      if (state.route === 'daily') drawDailyCanvas();
    }

    function toggleUILang() {
      state.uiLang = state.uiLang === 'id' ? 'en' : 'id';
      if (state.uiLang === 'id') state.translation = 'id';
      else if (state.translation === 'id') state.translation = 'web';
      persist();
      renderNav();
      render();
      showToast(state.uiLang === 'id' ? 'Bahasa Indonesia (TB) aktif' : 'Switched to English');
    }

    function renderNav() {
      const langBtn = document.getElementById('ui-lang-btn');
      if (langBtn) langBtn.textContent = state.uiLang === 'id' ? 'ID' : 'EN';
      const qsLabel = document.getElementById('quick-search-label');
      if (qsLabel) qsLabel.textContent = state.uiLang === 'id' ? 'Cari kitab...' : 'Jump to book...';

      const stats = getProgressStats();
      const headerProg = document.getElementById('header-progress-text');
      if (headerProg) {
        headerProg.textContent = state.uiLang === 'id'
          ? `${stats.chaptersCount} Pasal`
          : `${stats.chaptersCount} Ch`;
      }

      const secondaryRoutes = t().moreMenu.map(m => m.id);
      const isSecondaryActive = secondaryRoutes.includes(state.route);

      // Desktop Center Pill Nav
      const desktopDock = document.getElementById('desktop-nav-items');
      if (desktopDock) {
        desktopDock.innerHTML = t().desktopNav.map(it => {
          const active = it.isDrawer
            ? ['daily', 'characters', 'explorer', 'library', 'creator', 'settings'].includes(state.route)
            : state.route === it.id;
          const action = it.isDrawer ? 'openMoreMenu()' : `navigate('${it.id}')`;
          return `
            <button onclick="${action}" class="px-3.5 py-1.5 rounded-full flex items-center gap-1.5 text-xs font-semibold transition-all ${active ? 'bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 shadow-xs' : 'text-ink-mutedLight dark:text-ink-mutedDark hover:text-ink-light dark:hover:text-ink-dark'}">
              ${ICONS[it.icon]}
              <span>${it.label}</span>
            </button>
          `;
        }).join('');
      }

      // Mobile Bottom Floating Dock
      const dock = document.getElementById('bottom-nav-items');
      if (dock) {
        dock.innerHTML = t().primaryNav.map(it => {
          const active = it.isDrawer ? isSecondaryActive : state.route === it.id;
          const action = it.isDrawer ? 'openMoreMenu()' : `navigate('${it.id}')`;
          return `
            <button onclick="${action}" class="flex-1 py-2 px-1.5 min-h-[44px] rounded-full flex flex-col items-center justify-center gap-1 text-[10px] font-semibold transition-all ${active ? 'bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 shadow-xs' : 'text-ink-mutedLight dark:text-ink-mutedDark hover:text-ink-light dark:hover:text-ink-dark'}">
              ${ICONS[it.icon]}
              <span class="leading-none">${it.label}</span>
            </button>
          `;
        }).join('');
      }
    }

    function openMoreMenu() {
      const drawer = document.getElementById('more-menu-drawer');
      const grid = document.getElementById('more-menu-grid');
      if (!drawer || !grid) return;

      grid.innerHTML = t().moreMenu.map(m => {
        const active = state.route === m.id;
        return `
          <button onclick="closeMoreMenu(); navigate('${m.id}')" class="p-3.5 rounded-2xl border text-left transition-all flex flex-col justify-between gap-2.5 ${active ? 'bg-amber-500/10 border-brand' : 'bg-surface-subtleLight/70 dark:bg-surface-subtleDark/70 border-transparent hover:border-stone-300 dark:hover:border-stone-700'}">
            <div class="w-8 h-8 rounded-xl flex items-center justify-center ${active ? 'bg-brand text-white' : 'bg-surface-light dark:bg-surface-dark text-brand'}">
              ${ICONS[m.icon]}
            </div>
            <div>
              <span class="font-display font-bold text-xs block">${m.label}</span>
              <span class="text-[10px] text-ink-mutedLight dark:text-ink-mutedDark leading-tight block mt-0.5">${m.desc}</span>
            </div>
          </button>
        `;
      }).join('');

      drawer.classList.remove('hidden');
    }

    function closeMoreMenu() {
      const drawer = document.getElementById('more-menu-drawer');
      if (drawer) drawer.classList.add('hidden');
    }

    function navigate(route) {
      stopSpeech();
      closeVerseSheet();
      closeMoreMenu();
      if (state.focusMode && route !== 'read') toggleFocusMode();
      state.route = route;
      renderNav();

      const bar = document.getElementById('reader-floating-bar');
      if (bar) {
        if (route === 'read') bar.classList.remove('hidden');
        else bar.classList.add('hidden');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function toggleFocusMode() {
      state.focusMode = !state.focusMode;
      const header = document.getElementById('app-header');
      const footer = document.getElementById('app-footer');
      const dock = document.getElementById('bottom-dock');
      const btn = document.getElementById('focus-btn');
      if (state.focusMode) {
        header.classList.add('hidden');
        footer.classList.add('hidden');
        dock.classList.add('hidden');
        if (btn) btn.textContent = 'Keluar';
        showToast('Mode Fokus Aktif');
      } else {
        header.classList.remove('hidden');
        footer.classList.remove('hidden');
        dock.classList.remove('hidden');
        if (btn) btn.textContent = 'Fokus';
      }
    }

    function adjustFontSize(delta) {
      state.fontSize = Math.min(26, Math.max(15, state.fontSize + delta));
      persist();
      const el = document.getElementById('verses-list');
      if (el) el.style.fontSize = `${state.fontSize}px`;
    }

    function openQuickSearch() {
      document.getElementById('search-modal').classList.remove('hidden');
      const inp = document.getElementById('global-search-input');
      inp.value = '';
      inp.focus();
      handleQuickSearch('');
    }
    function closeQuickSearch() {
      document.getElementById('search-modal').classList.add('hidden');
    }
    function handleQuickSearch(q) {
      const box = document.getElementById('quick-search-results');
      const term = q.trim().toLowerCase();
      const matches = BOOKS.filter(b =>
        b.nameId.toLowerCase().includes(term) || b.nameEn.toLowerCase().includes(term)
      );
      box.innerHTML = matches.map(b => `
        <button onclick="jumpToBook('${b.id}')" class="w-full p-3 rounded-2xl hover:bg-surface-subtleLight dark:hover:bg-surface-subtleDark flex items-center justify-between text-left transition-colors">
          <div>
            <span class="font-display font-semibold text-sm block">${state.uiLang === 'id' ? b.nameId : b.nameEn}</span>
            <span class="text-[11px] text-ink-mutedLight dark:text-ink-mutedDark line-clamp-1">${state.uiLang === 'id' ? b.summaryId : b.summaryEn}</span>
          </div>
          <span class="text-xs text-brand font-semibold shrink-0 ml-3">${b.chapters} Pasal →</span>
        </button>
      `).join('');
    }
    function jumpToBook(bookId, chapter = 1) {
      state.currentBook = bookId;
      state.currentChapter = chapter;
      persist();
      closeQuickSearch();
      navigate('read');
    }
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openQuickSearch();
      } else if (e.key === 'Escape') {
        closeQuickSearch();
        closeVerseSheet();
        closeNoteModal();
        closeMoreMenu();
      }
    });

    function getBookName(b) {
      return state.uiLang === 'id' ? b.nameId : b.nameEn;
    }

    // =========================================================================
    // 9. INDONESIAN BIBLE (TB) MULTI-SOURCE FETCHER + OFFLINE BANK
    // =========================================================================
    async function fetchIndonesianFromAPIs(bookObj, chapter) {
      try {
        const res = await fetch(`https://bolls.life/get-text/TB/${bookObj.num}/${chapter}/`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            return data.map(v => ({
              book_name: bookObj.nameId,
              chapter: Number(chapter),
              verse: Number(v.verse),
              text: String(v.text || '').replace(/<[^>]*>/g, '').trim()
            }));
          }
        }
      } catch (e) {}

      try {
        const res2 = await fetch(`https://beeble.vercel.app/api/v1/passage/${encodeURIComponent(bookObj.apiId)}/${chapter}`);
        if (res2.ok) {
          const json2 = await res2.json();
          const verses = json2?.data?.verses || [];
          if (verses.length > 0) {
            return verses.map(v => ({
              book_name: bookObj.nameId,
              chapter: Number(chapter),
              verse: Number(v.verse),
              text: String(v.content || v.text || '').trim()
            }));
          }
        }
      } catch (e) {}

      return null;
    }

    async function fetchChapter(bookId, chapter) {
      const bookObj = BOOKS.find(b => b.id === bookId) || BOOKS[0];
      const label = getBookName(bookObj);
      const container = document.getElementById('verses-list');
      if (container) {
        container.innerHTML = `
          <div class="space-y-3 py-8 animate-pulse">
            <div class="h-4 bg-surface-subtleLight dark:bg-surface-subtleDark rounded-full w-3/4"></div>
            <div class="h-4 bg-surface-subtleLight dark:bg-surface-subtleDark rounded-full w-full"></div>
            <div class="h-4 bg-surface-subtleLight dark:bg-surface-subtleDark rounded-full w-5/6"></div>
          </div>`;
      }

      const key = `${bookId}:${chapter}`;

      if (state.translation === 'id') {
        const liveIndo = await fetchIndonesianFromAPIs(bookObj, chapter);
        if (liveIndo && liveIndo.length > 0) {
          state.chapterVerses = liveIndo;
          recordHistory(`${bookObj.nameId} ${chapter}`, key);
          renderVerses();
          return;
        }
        if (ID_SCRIPTURE_BANK[key]) {
          state.chapterVerses = ID_SCRIPTURE_BANK[key].map(v => ({
            book_name: bookObj.nameId,
            chapter,
            verse: v.verse,
            text: v.text
          }));
          recordHistory(`${bookObj.nameId} ${chapter}`, key);
          renderVerses();
          return;
        }
        if (container) {
          container.innerHTML = `
            <div class="p-6 rounded-2xl bg-surface-subtleLight dark:bg-surface-subtleDark text-center space-y-2">
              <p class="text-sm font-semibold">Teks Alkitab Indonesia (${bookObj.nameId} ${chapter}) belum termuat offline.</p>
              <p class="text-xs text-ink-mutedLight dark:text-ink-mutedDark">Pastikan koneksi internet aktif untuk mengambil seluruh pasal TB, atau buka pasal pilihan seperti Yohanes 1, Surat Roma 8, Surat Filipi 4, Surat 1 Korintus 13, Surat Yakobus 1, dan Mazmur 23.</p>
            </div>`;
        }
        return;
      }

      try {
        const res = await fetch(`https://bible-api.com/${encodeURIComponent(bookObj.nameEn + ' ' + chapter)}?translation=${state.translation}`);
        if (!res.ok) throw new Error('API Error');
        const data = await res.json();
        state.chapterVerses = (data.verses || []).map(v => ({
          book_name: v.book_name,
          chapter: v.chapter,
          verse: v.verse,
          text: v.text
        }));
        recordHistory(`${label} ${chapter}`, key);
        renderVerses();
      } catch (err) {
        if (container) {
          container.innerHTML = `<div class="p-6 rounded-2xl bg-surface-subtleLight dark:bg-surface-subtleDark text-center text-xs">Gagal memuat teks. Periksa koneksi internet kamu.</div>`;
        }
      }
    }

    function recordHistory(entry, key) {
      state.history = [entry, ...state.history.filter(h => h !== entry)].slice(0, 12);
      if (key && !state.readChapters.includes(key)) {
        state.readChapters.push(key);
      }
      persist();
      renderNav();
    }

    function speakCurrentChapter() {
      if (!('speechSynthesis' in window)) {
        showToast('Browser tidak mendukung fitur suara');
        return;
      }
      if (state.isSpeaking) {
        stopSpeech();
        return;
      }
      if (!state.chapterVerses.length) return;
      const fullText = state.chapterVerses.map(v => v.text).join(' ');
      const utter = new SpeechSynthesisUtterance(fullText);
      utter.lang = state.translation === 'id' ? 'id-ID' : 'en-US';
      utter.rate = 0.96;
      utter.onend = () => {
        state.isSpeaking = false;
        const lbl = document.getElementById('tts-label');
        if (lbl) lbl.textContent = 'Dengar';
      };
      state.isSpeaking = true;
      const lbl = document.getElementById('tts-label');
      if (lbl) lbl.textContent = 'Stop';
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      state.isSpeaking = false;
      const lbl = document.getElementById('tts-label');
      if (lbl) lbl.textContent = 'Dengar';
    }

    // =========================================================================
    // 10. INTERACTIVE TAP-TO-SELECT VERSE ACTION SHEET
    // =========================================================================
    function selectVerseForAction(ref, text) {
      state.selectedVerse = { ref, text };
      document.getElementById('sheet-verse-ref').textContent = ref;
      document.getElementById('sheet-verse-snippet').textContent = text;
      const isBm = state.bookmarks.some(b => b.ref === ref);
      document.getElementById('sheet-bm-btn').textContent = isBm ? 'Tersimpan' : 'Simpan';
      document.getElementById('verse-action-sheet').classList.remove('hidden');
      renderVerses(document.getElementById('verse-filter')?.value || '');
    }

    function closeVerseSheet() {
      state.selectedVerse = null;
      const sheet = document.getElementById('verse-action-sheet');
      if (sheet) sheet.classList.add('hidden');
      if (state.route === 'read') renderVerses(document.getElementById('verse-filter')?.value || '');
    }

    function applySheetHighlight(color) {
      if (!state.selectedVerse) return;
      const { ref } = state.selectedVerse;
      if (!color) delete state.highlights[ref];
      else state.highlights[ref] = color;
      persist();
      renderVerses(document.getElementById('verse-filter')?.value || '');
      showToast(color ? `Ditandai (${ref})` : 'Stabilo dihapus');
    }

    function bookmarkFromSheet() {
      if (!state.selectedVerse) return;
      const { ref, text } = state.selectedVerse;
      const idx = state.bookmarks.findIndex(b => b.ref === ref);
      if (idx >= 0) {
        state.bookmarks.splice(idx, 1);
        document.getElementById('sheet-bm-btn').textContent = 'Simpan';
        showToast('Dihapus dari tersimpan');
      } else {
        state.bookmarks.unshift({ ref, text, translation: state.translation.toUpperCase(), date: new Date().toLocaleDateString() });
        document.getElementById('sheet-bm-btn').textContent = 'Tersimpan';
        showToast(`Disimpan: ${ref}`);
      }
      persist();
    }

    function noteFromSheet() {
      if (!state.selectedVerse) return;
      openNoteModal(state.selectedVerse.ref, state.selectedVerse.text);
    }

    function shareCardFromSheet() {
      if (!state.selectedVerse) return;
      state.dailyCustomText = state.selectedVerse.text;
      state.dailyCustomRef = state.selectedVerse.ref;
      closeVerseSheet();
      navigate('daily');
    }

    // =========================================================================
    // 11. SPOTLIGHT SWITCHER
    // =========================================================================
    function setSpotlight(idx) {
      state.spotlightIdx = (idx + SPOTLIGHTS.length) % SPOTLIGHTS.length;
      const box = document.getElementById('spotlight-stage');
      if (box) box.innerHTML = buildSpotlightStage();
    }

    function saveSpotlightVerse() {
      const sp = SPOTLIGHTS[state.spotlightIdx];
      const ref = state.uiLang === 'id' ? sp.refId : sp.refEn;
      const text = state.uiLang === 'id' ? sp.verseId : sp.verseEn;
      if (!state.bookmarks.some(b => b.ref === ref)) {
        state.bookmarks.unshift({ ref, text, translation: state.uiLang.toUpperCase(), date: new Date().toLocaleDateString() });
        persist();
      }
      showToast(`Tersimpan: ${ref}`);
    }

    function createCardFromSpotlight() {
      const sp = SPOTLIGHTS[state.spotlightIdx];
      state.dailyCustomText = state.uiLang === 'id' ? sp.verseId : sp.verseEn;
      state.dailyCustomRef = state.uiLang === 'id' ? sp.refId : sp.refEn;
      navigate('daily');
    }

    function buildSpotlightStage() {
      const sp = SPOTLIGHTS[state.spotlightIdx];
      const isId = state.uiLang === 'id';
      const verse = isId ? sp.verseId : sp.verseEn;
      const ref = isId ? sp.refId : sp.refEn;
      const meaning = isId ? sp.meaningId : sp.meaningEn;
      const tafsir = isId ? sp.tafsirId : sp.tafsirEn;
      const reflection = isId ? sp.reflectionId : sp.reflectionEn;

      return `
        <div class="fade-up space-y-5">
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
            ${SPOTLIGHTS.map((item, i) => `
              <button onclick="setSpotlight(${i})" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${i === state.spotlightIdx ? 'bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900' : 'bg-surface-subtleLight dark:bg-surface-subtleDark text-ink-mutedLight dark:text-ink-mutedDark hover:text-ink-light dark:hover:text-ink-dark'}">
                ${isId ? item.moodId : item.moodEn}
              </button>
            `).join('')}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">

    // =========================================================================

    // =========================================================================
    function buildRadialRing(pct, size = 68, stroke = 6, label = '') {
      const r = (size - stroke) / 2;
      const circ = 2 * Math.PI * r;
      const offset = circ - (pct / 100) * circ;
      return `
        <div class="relative inline-flex items-center justify-center shrink-0" style="width:${size}px;height:${size}px">
          <svg class="-rotate-90" width="${size}" height="${size}">
            <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="transparent" stroke="currentColor" stroke-width="${stroke}" class="text-stone-200 dark:text-stone-800" />
            <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="transparent" stroke="currentColor" stroke-width="${stroke}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" class="text-brand transition-all duration-500" />
          </svg>
          <span class="absolute font-display font-bold text-xs">${label || pct + '%'}</span>
        </div>
      `;
    }

    // --- READER VIEW ---
    function viewReader() {
      const bookObj = BOOKS.find(b => b.id === state.currentBook) || BOOKS[0];
      const chapters = Array.from({ length: bookObj.chapters }, (_, i) => i + 1);
      const isId = state.uiLang === 'id';
      const chapterKey = `${bookObj.id}:${state.currentChapter}`;
      const isRead = state.readChapters.includes(chapterKey);

      return `
        <div class="fade-up max-w-3xl mx-auto space-y-6 pb-24">
          <!-- Top Pill Selector Bar -->
          <div class="flex flex-wrap items-center justify-between gap-2.5 p-2.5 rounded-3xl bg-surface-light dark:bg-surface-dark border border-stone-200/80 dark:border-stone-800">
            <div class="flex flex-wrap items-center gap-1.5">
              <select onchange="changeBook(this.value)" class="px-3.5 py-2 rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark text-xs font-bold focus:outline-none">
                ${BOOKS.map(b => `<option value="${b.id}" ${b.id === bookObj.id ? 'selected' : ''}>${getBookName(b)}</option>`).join('')}
              </select>

              <select onchange="changeChapter(this.value)" class="px-3.5 py-2 rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark text-xs font-semibold focus:outline-none">
                ${chapters.map(c => `<option value="${c}" ${c === state.currentChapter ? 'selected' : ''}>${isId ? 'Pasal' : 'Ch'} ${c}</option>`).join('')}

              <select onchange="changeTranslation(this.value)" class="px-3.5 py-2 rounded-full bg-amber-500/15 text-brand text-xs font-bold focus:outline-none">

            </div>

            <input id="verse-filter" oninput="renderVerses(this.value)" type="text" placeholder="${isId ? 'Filter ayat...' : 'Filter verses...'}" class="w-full sm:w-44 px-3.5 py-2 rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark text-xs focus:outline-none" />

              <span class="text-xs font-bold uppercase tracking-wider text-brand">${bookObj.testament === 'OT' ? (isId ? 'Perjanjian Lama' : 'Old Testament') : (isId ? 'Perjanjian Baru' : 'New Testament')}</span>
              <h1 class="font-display font-bold text-3xl sm:text-4xl tracking-tight">${getBookName(bookObj)} ${state.currentChapter}</h1>
              <p class="text-xs text-ink-mutedLight dark:text-ink-mutedDark">${isId ? bookObj.summaryId : bookObj.summaryEn}</p>
            </div>

            <button onclick="markCurrentChapterCompleted()" class="self-start sm:self-end inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-bold transition-colors shrink-0 ${isRead ? 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-400' : 'bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900'}">
              ${ICONS.check}
              <span>${isRead ? (isId ? 'Pasal Tercatat' : 'Chapter Logged') : (isId ? 'Tandai Selesai' : 'Mark Complete')}</span>
            </button>
          </div>

          <!-- Clean Verses Container -->
          <div id="verses-list" style="font-size:${state.fontSize}px" class="rounded-3xl bg-surface-light dark:bg-surface-dark border border-stone-200/80 dark:border-stone-800 p-5 sm:p-8 space-y-2 leading-[1.85]"></div>
        </div>
      `;
    }

    function renderVerses(filter = '') {
      const box = document.getElementById('verses-list');
      if (!box) return;
      const q = filter.trim().toLowerCase();
      const list = q ? state.chapterVerses.filter(v => v.text.toLowerCase().includes(q) || String(v.verse) === q) : state.chapterVerses;

      if (!list.length) {
        box.innerHTML = `<p class="text-center py-8 text-xs text-ink-mutedLight dark:text-ink-mutedDark">Ayat tidak ditemukan.</p>`;
        return;
      }

      const hlMap = {
        amber: 'bg-amber-200/75 dark:bg-amber-400/25 px-1.5 py-0.5 rounded-lg',
        terracotta: 'bg-orange-200/75 dark:bg-orange-400/25 px-1.5 py-0.5 rounded-lg',
        stone: 'bg-stone-200/85 dark:bg-stone-600/40 px-1.5 py-0.5 rounded-lg',
        rose: 'bg-rose-200/75 dark:bg-rose-400/25 px-1.5 py-0.5 rounded-lg'
      };

      box.innerHTML = list.map(v => {
        const ref = `${v.book_name} ${v.chapter}:${v.verse}`;
        const hl = state.highlights[ref];
        const isSelected = state.selectedVerse && state.selectedVerse.ref === ref;
        const isBm = state.bookmarks.some(b => b.ref === ref);
        const hasNote = state.notes.some(n => n.ref === ref);

        return `
          <div onclick="selectVerseForAction('${ref.replace(/'/g, "\\'")}', \`${v.text.trim().replace(/`/g, '')}\`)" class="verse-tap cursor-pointer p-2.5 rounded-2xl transition-colors ${isSelected ? 'bg-amber-500/10 ring-1 ring-brand' : 'hover:bg-surface-subtleLight/70 dark:hover:bg-surface-subtleDark/60'}">
            <sup class="font-display font-bold text-[11px] text-brand mr-1.5 select-none">${v.verse}</sup>
            <span class="${hl ? hlMap[hl] : ''}">${v.text.trim()}</span>
            ${isBm ? '<span class="ml-1.5 text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-amber-500/15 text-brand">Saved</span>' : ''}
            ${hasNote ? '<span class="ml-1 text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-stone-200 dark:bg-stone-700">Note</span>' : ''}
          </div>
        `;
      }).join('');
    }

    function changeBook(id) { state.currentBook = id; state.currentChapter = 1; persist(); render(); }
    function changeChapter(ch) { state.currentChapter = parseInt(ch, 10); persist(); render(); }
    function changeTranslation(code) { state.translation = code; persist(); fetchChapter(state.currentBook, state.currentChapter); }
    function stepChapter(delta) {
      const idx = BOOKS.findIndex(b => b.id === state.currentBook);
      const b = BOOKS[idx];
      let next = state.currentChapter + delta;
      if (next >= 1 && next <= b.chapters) state.currentChapter = next;
      else if (delta > 0 && idx < BOOKS.length - 1) { state.currentBook = BOOKS[idx + 1].id; state.currentChapter = 1; }
      else if (delta < 0 && idx > 0) { state.currentBook = BOOKS[idx - 1].id; state.currentChapter = BOOKS[idx - 1].chapters; }
      persist();
      render();
    }

    function openNoteModal(ref, text) {
      state.activeNoteTarget = { ref, text };
      const existing = state.notes.find(n => n.ref === ref);
      document.getElementById('note-verse-ref').textContent = ref;
      document.getElementById('note-verse-preview').textContent = text;
      document.getElementById('note-input').value = existing ? existing.content : '';
      document.getElementById('note-modal').classList.remove('hidden');
    }
    function closeNoteModal() { document.getElementById('note-modal').classList.add('hidden'); }
    function saveNote() {
      if (!state.activeNoteTarget) return;
      const content = document.getElementById('note-input').value.trim();
      const { ref, text } = state.activeNoteTarget;
      state.notes = state.notes.filter(n => n.ref !== ref);
      if (content) {
        state.notes.unshift({ ref, text, content, date: new Date().toLocaleDateString() });
        showToast('Catatan disimpan');
      }
      persist();
      closeNoteModal();
      closeVerseSheet();
      if (state.route === 'library') render();
    }

      } else {

        if (!state.readChapters.includes(chKey)) {
          state.readChapters.push(chKey);
        }
        const b = BOOKS.find(x => x.id === bookId);
        if (b) {
          const entry = `${getBookName(b)} ${ch}`;
          state.history = [entry, ...state.history.filter(h => h !== entry)].slice(0, 12);
        }

      persist();
      renderNav();
      render();
    }

    function renderCanvasText(ctx, text, ref, fg, accent) {
      ctx.fillStyle = accent;
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('BIBLESPACE', 56, 72);

      ctx.fillStyle = fg;
      ctx.font = '32px Georgia, serif';
      const words = `“${text}”`.split(' ');
      let line = '';
      let y = 185;
      for (let i = 0; i < words.length; i++) {
        const test = line + words[i] + ' ';
        if (ctx.measureText(test).width > 480 && i > 0) {
          ctx.fillText(line, 56, y);
          line = words[i] + ' ';
          y += 44;
        } else {
          line = test;
        }
      }
      ctx.fillText(line, 56, y);

      ctx.fillStyle = accent;
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText(ref, 56, y + 64);

      ctx.font = '12px sans-serif';
      ctx.fillText('biblespace • @doysleepwell', 56, 544);
    }

    function drawDailyCanvas() {
      const canvas = document.getElementById('daily-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const sp = SPOTLIGHTS[state.spotlightIdx];
      const isId = state.uiLang === 'id';
      const text = state.dailyCustomText || (isId ? sp.verseId : sp.verseEn);
      const ref = state.dailyCustomRef || (isId ? sp.refId : sp.refEn);

      if (state.cardTheme === 'photoMorning' || state.cardTheme === 'photoMountain') {
        const imgUrl = state.cardTheme === 'photoMorning' ? PHOTOS.morningLight : PHOTOS.mountainDawn;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          ctx.drawImage(img, 0, 0, 600, 600);
          ctx.fillStyle = 'rgba(20, 18, 16, 0.56)';
          ctx.fillRect(0, 0, 600, 600);
          renderCanvasText(ctx, text, ref, '#FFFFFF', '#FDE68A');
        };
        img.onerror = () => {
          ctx.fillStyle = '#1C1917';
          ctx.fillRect(0, 0, 600, 600);
          renderCanvasText(ctx, text, ref, '#FFFFFF', '#FBBF24');
        };
        img.src = imgUrl;
        return;
      }

      const themes = {
        espresso: { bg1: '#1C1917', bg2: '#0C0A09', fg: '#FAFAF9', accent: '#F59E0B' },
        paper: { bg1: '#FAF8F5', bg2: '#EFECE6', fg: '#18181B', accent: '#B45309' }
      };
      const pal = themes[state.cardTheme] || themes.espresso;

      const grad = ctx.createLinearGradient(0, 0, 600, 600);
      grad.addColorStop(0, pal.bg1);
      grad.addColorStop(1, pal.bg2);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 600, 600);
      renderCanvasText(ctx, text, ref, pal.fg, pal.accent);
    }

              ${q.options.map((opt, i) => {
                let cardStyle = 'bg-surface-subtleLight/70 dark:bg-surface-subtleDark/70 border-transparent hover:border-stone-400 dark:hover:border-stone-600';
                let badgeStyle = 'bg-surface-light dark:bg-surface-dark text-ink-light dark:text-ink-dark border border-stone-200 dark:border-stone-700';
                let statusIcon = '';

                if (answered) {
                  if (i === q.answer) {
                    cardStyle = 'bg-emerald-500/10 border-emerald-600/60 dark:border-emerald-400/50';
                    badgeStyle = 'bg-emerald-600 text-white border-transparent';
                    statusIcon = '✓';
                  } else if (i === state.quizSelectedOption) {
                    cardStyle = 'bg-rose-500/10 border-rose-500/60';
                    badgeStyle = 'bg-rose-600 text-white border-transparent';
                    statusIcon = '✕';
                  } else {
                    cardStyle = 'opacity-50 border-transparent bg-surface-subtleLight/40 dark:bg-surface-subtleDark/40';
                  }
                }

                return `
                  <button onclick="answerQuiz(${i})" ${answered ? 'disabled' : ''} class="w-full text-left p-4 rounded-2xl border transition-all flex items-center justify-between gap-3 ${cardStyle}">
                    <div class="flex items-center gap-3.5">
                      <span class="w-8 h-8 rounded-xl flex items-center justify-center font-display font-bold text-xs shrink-0 ${badgeStyle}">
                        ${statusIcon || letters[i]}
                      </span>
                      <span class="text-sm font-medium leading-snug">${opt}</span>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>

            ${answered ? `
              <div class="p-5 rounded-2xl bg-surface-subtleLight dark:bg-surface-subtleDark border border-stone-200 dark:border-stone-800 space-y-3 fade-up">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold ${state.quizSelectedOption === q.answer ? 'text-emerald-600 dark:text-emerald-400' : 'text-brand'}">
                    ${state.quizSelectedOption === q.answer ? 'Jawaban Tepat!' : 'Pembahasan'}
                  </span>
                  <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-surface-light dark:bg-surface-dark">${q.ref}</span>
                </div>
                <p class="text-xs text-ink-mutedLight dark:text-ink-mutedDark leading-relaxed">${q.exp}</p>
                <div class="pt-1">
                  <button onclick="nextQuiz()" class="px-5 py-2.5 rounded-full bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 text-xs font-bold">
                    ${state.quizIndex + 1 === total ? 'Lihat Hasil Akhir →' : 'Pertanyaan Berikutnya →'}
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function answerQuiz(i) {
      if (state.quizSelectedOption !== null) return;
      state.quizSelectedOption = i;
      const q = QUIZ_QUESTIONS[state.quizIndex];
      if (i === q.answer) {
        state.quizScore++;
        state.quizStreak++;
      } else {
        state.quizStreak = 0;
      }
      render();
    }
    function nextQuiz() { state.quizIndex++; state.quizSelectedOption = null; render(); }
    function resetQuiz() { state.quizIndex = 0; state.quizScore = 0; state.quizStreak = 0; state.quizSelectedOption = null; render(); }

    // --- LIBRARY ---
    function viewLibrary() {
      const hlKeys = Object.keys(state.highlights);
      return `
        <div class="fade-up space-y-8">
          <h1 class="font-display font-bold text-3xl tracking-tight">Tersimpan &amp; Catatan</h1>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="space-y-3">
              <h2 class="font-display font-bold text-base">Bookmark (${state.bookmarks.length})</h2>
              ${state.bookmarks.length ? state.bookmarks.map(b => `
                <div class="p-4 rounded-2xl bg-surface-light dark:bg-surface-dark border border-stone-200/80 dark:border-stone-800 space-y-1">
                  <span class="text-xs font-bold text-brand">${b.ref}</span>
                  <p class="text-xs leading-relaxed">${b.text}</p>
                </div>
              `).join('') : '<p class="text-xs opacity-60">Belum ada bookmark.</p>'}
            </div>

            <div class="space-y-3">
              <h2 class="font-display font-bold text-base">Stabilo (${hlKeys.length})</h2>
              ${hlKeys.length ? hlKeys.map(ref => `
                <div class="p-3.5 rounded-2xl bg-surface-light dark:bg-surface-dark border border-stone-200/80 dark:border-stone-800 flex justify-between items-center text-xs">
                  <span class="font-semibold">${ref}</span>
                  <span class="px-2.5 py-0.5 rounded-full bg-amber-500/15 text-brand font-bold">${state.highlights[ref]}</span>
                </div>
              `).join('') : '<p class="text-xs opacity-60">Belum ada stabilo.</p>'}
            </div>

            <div class="space-y-3">
              <h2 class="font-display font-bold text-base">Catatan (${state.notes.length})</h2>
              ${state.notes.length ? state.notes.map(n => `
                <div class="p-4 rounded-2xl bg-surface-light dark:bg-surface-dark border border-stone-200/80 dark:border-stone-800 space-y-1">
                  <span class="text-xs font-bold text-accent">${n.ref}</span>
                  <p class="text-xs leading-relaxed">${n.content}</p>
                </div>
              `).join('') : '<p class="text-xs opacity-60">Belum ada catatan.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    // --- CREATOR VIEW ---
    function viewCreator() {
      return `
        <div class="fade-up max-w-3xl mx-auto space-y-8">
          <div>
            <span class="text-xs font-bold uppercase tracking-widest text-brand">Menu Kreator</span>
            <h1 class="font-display font-bold text-3xl sm:text-4xl tracking-tight mt-1">Tentang Kreator</h1>
            <p class="text-xs text-ink-mutedLight dark:text-ink-mutedDark mt-1">Di balik perancangan dan pengembangan aplikasi web BibleSpace.</p>
          </div>

          <div class="rounded-3xl overflow-hidden bg-surface-light dark:bg-surface-dark border border-stone-200/80 dark:border-stone-800">
            <div class="h-44 relative overflow-hidden">
              <img src="${PHOTOS.ancientScroll}" alt="Creator Workspace" class="w-full h-full object-cover" />
              <div class="absolute inset-0 bg-gradient-to-t from-stone-950/80 via-stone-950/35 to-transparent"></div>
            </div>

            <div class="p-6 sm:p-8 -mt-12 relative z-10 space-y-6">
              <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                <div class="flex items-end gap-4">
                  <div class="w-20 h-20 rounded-3xl bg-stone-900 dark:bg-stone-100 text-stone-50 dark:text-stone-900 border-4 border-surface-light dark:border-surface-dark flex items-center justify-center font-serif italic font-bold text-4xl shadow-md">
                    D
                  </div>
                  <div class="pb-1">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-brand block">Developer &amp; UI Designer</span>
                    <h2 class="font-display font-bold text-2xl">Dandy</h2>
                  </div>
                </div>

                <div class="flex flex-wrap gap-2">
                  <a href="https://www.instagram.com/doysleepwell/" target="_blank" rel="noopener noreferrer" class="px-5 py-2.5 rounded-full bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 hover:opacity-90 text-xs font-bold transition-opacity">
                    Instagram @doysleepwell ↗
                  </a>
                  <button onclick="copyCreatorUsername()" class="px-4 py-2.5 rounded-full bg-surface-subtleLight dark:bg-surface-subtleDark hover:bg-stone-200 dark:hover:bg-stone-800 text-xs font-semibold transition-colors">
                    Salin Handle
                  </button>
                </div>
              </div>

              <p class="text-sm text-ink-mutedLight dark:text-ink-mutedDark leading-relaxed">
                Mahasiswa Teknik Informatika &amp; Web Developer yang merancang <strong class="text-ink-light dark:text-ink-dark">BibleSpace</strong> dengan visi menghadirkan ruang baca Alkitab digital yang hangat, bebas gangguan, mudah dipahami dalam Bahasa Indonesia, serta dilengkapi konteks historis dan bahasa asli.
              </p>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                <div class="p-4 rounded-2xl bg-surface-subtleLight dark:bg-surface-subtleDark">
                  <span class="text-[10px] uppercase tracking-wider font-bold text-brand block">Fokus Desain</span>
                  <span class="font-display font-bold text-sm mt-1 block">Editorial &amp; Tenang</span>
                </div>
                <div class="p-4 rounded-2xl bg-surface-subtleLight dark:bg-surface-subtleDark">
                  <span class="text-[10px] uppercase tracking-wider font-bold text-brand block">Teks Utama</span>
                  <span class="font-display font-bold text-sm mt-1 block">Terjemahan Baru (TB)</span>
                </div>
                <div class="p-4 rounded-2xl bg-surface-subtleLight dark:bg-surface-subtleDark">
                  <span class="text-[10px] uppercase tracking-wider font-bold text-brand block">Kontak Sosial</span>
                  <span class="font-display font-bold text-sm mt-1 block">@doysleepwell</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // --- SETTINGS ---
    function viewSettings() {
      return `
        <div class="fade-up max-w-xl mx-auto space-y-5">
          <h1 class="font-display font-bold text-3xl tracking-tight">Pengaturan</h1>
          <div class="p-5 rounded-3xl bg-surface-light dark:bg-surface-dark border border-stone-200/80 dark:border-stone-800 flex items-center justify-between gap-4">
            <div>
              <h3 class="font-display font-bold text-sm">Bahasa Aplikasi &amp; Alkitab</h3>
              <p class="text-xs text-ink-mutedLight dark:text-ink-mutedDark">Indonesia (TB) / English</p>
            </div>
            <button onclick="toggleUILang()" class="px-4 py-2 rounded-full bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 text-xs font-bold shrink-0">${state.uiLang.toUpperCase()}</button>
          </div>
          <div class="p-5 rounded-3xl bg-surface-light dark:bg-surface-dark border border-stone-200/80 dark:border-stone-800 flex items-center justify-between gap-4">
            <div>
              <h3 class="font-display font-bold text-sm">Mode Tampilan</h3>
              <p class="text-xs text-ink-mutedLight dark:text-ink-mutedDark">Warm Paper Light / Espresso Dark</p>
            </div>
            <button onclick="toggleTheme(); render();" class="px-4 py-2 rounded-full bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 text-xs font-bold shrink-0">${state.theme === 'light' ? 'Dark Mode' : 'Light Mode'}</button>
          </div>
          <div class="p-5 rounded-3xl bg-surface-light dark:bg-surface-dark border border-stone-200/80 dark:border-stone-800 flex items-center justify-between gap-4">
            <div>
              <h3 class="font-display font-bold text-sm">Reset Progres Bacaan</h3>
              <p class="text-xs text-ink-mutedLight dark:text-ink-mutedDark">Kembalikan hitungan pasal &amp; tahap ke 0</p>
            </div>
            <button onclick="resetAllProgress()" class="px-4 py-2 rounded-full bg-rose-600 text-white text-xs font-bold shrink-0">Reset 0</button>
          </div>
        </div>
      `;
    }

    // --- ROUTE DISPATCHER ---
    function render() {
      const root = document.getElementById('app-root');
      switch (state.route) {
        case 'home': root.innerHTML = viewHome(); break;
        case 'read':
          root.innerHTML = viewReader();
          fetchChapter(state.currentBook, state.currentChapter);
          break;
        case 'daily':
          root.innerHTML = viewDaily();
          setTimeout(drawDailyCanvas, 30);
          break;
        case 'study': root.innerHTML = viewStudy(); break;
        case 'characters': root.innerHTML = viewCharacters(); break;
        case 'explorer': root.innerHTML = viewExplorer(); break;
        case 'quiz': root.innerHTML = viewQuiz(); break;
        case 'plans': root.innerHTML = viewPlans(); break;
        case 'library': root.innerHTML = viewLibrary(); break;
        case 'creator': root.innerHTML = viewCreator(); break;
        case 'settings': root.innerHTML = viewSettings(); break;
      }
    }

    // Boot
    renderNav();
    applyTheme();
    navigate('home');
  </script>
</body>
</html>
